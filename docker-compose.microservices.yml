# Local microservices stack (Bitnami Kafka — not MSK). Use before AWS deployment.
x-service-env: &service-env
  DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_store
  MONGODB_URI: mongodb://mongo:27017
  MONGODB_DB: beauty_catalog
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CORS_ORIGINS: http://localhost:3001
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_URL: http://localhost:9000/beauty-products
  CATALOG_SERVICE_URL: http://catalog:8000
  CART_SERVICE_URL: http://cart:8000
  PAYMENT_SERVICE_URL: http://payment:8000
  ORDER_SERVICE_URL: http://order:8000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty_store
    ports:
      - "5432:5432"
    volumes:
      - ms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty -d beauty_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ms_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ms_minio_data:/data

  kafka:
    image: docker.io/bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_KRAFT_CLUSTER_ID: Mkq3sN4uR2C9xY7pL1vW8aB
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  auth:
    build:
      context: .
      dockerfile: apps/services/auth/Dockerfile
    ports:
      - "8001:8000"
    environment:
      <<: *service-env
      APP_NAME: Beauty Store Auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile: apps/services/catalog/Dockerfile
    ports:
      - "8002:8000"
    environment:
      <<: *service-env
      APP_NAME: Beauty Store Catalog
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started

  cart:
    build:
      context: .
      dockerfile: apps/services/cart/Dockerfile
    ports:
      - "8003:8000"
    environment:
      <<: *service-env
      APP_NAME: Beauty Store Cart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog:
        condition: service_started

  order:
    build:
      context: .
      dockerfile: apps/services/order/Dockerfile
    ports:
      - "8004:8000"
    environment:
      <<: *service-env
      APP_NAME: Beauty Store Order
    depends_on:
      postgres:
        condition: service_healthy
      cart:
        condition: service_started
      payment:
        condition: service_started
      kafka:
        condition: service_healthy

  payment:
    build:
      context: .
      dockerfile: apps/services/payment/Dockerfile
    ports:
      - "8005:8000"
    environment:
      <<: *service-env
      APP_NAME: Beauty Store Payment
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: apps/services/notification/Dockerfile
    environment:
      <<: *service-env
      KAFKA_CONSUMER_GROUP: notification-worker
      APP_NAME: Beauty Store Notification
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  ms_postgres_data:
  ms_mongo_data:
  ms_minio_data:
