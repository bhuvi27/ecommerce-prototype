name: Deploy AWS Microservices

on:
  push:
    branches: [aws-microservices]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-microservices
  cancel-in-progress: true

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        working-directory: web
        env:
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: ${{ vars.MS_NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.MS_AWS_REGION || 'ap-south-1' }}

      - name: Sync UI to S3
        run: |
          aws s3 sync web/out/ "s3://${{ vars.MS_UI_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.MS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  build-push-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, catalog, cart, order, payment, notification]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.MS_AWS_REGION || 'ap-south-1' }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: beauty-ms-dev/${{ matrix.service }}
        run: |
          docker build -f apps/services/${{ matrix.service }}/Dockerfile -t "$ECR_REGISTRY/$ECR_REPO:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPO:latest"
